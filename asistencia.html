<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia</title>
  <meta name="description" content="Control de asistencia universitaria por ramos, horarios y clases.">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-title">Control de <span>Asistencia</span></div>
    <div class="hdr-right">
      <div class="tabs">
        <button class="tab active" id="tab-cal" onclick="switchView('cal')"><span class="tab-ico" aria-hidden="true"><i data-lucide="calendar"></i></span><span id="tab-cal-label">Horario</span></button>
        <button class="tab" id="tab-list" onclick="switchView('list')"><span class="tab-ico" aria-hidden="true"><i data-lucide="book-open"></i></span><span>Ramos</span></button>
      </div>
      <div class="hdr-actions">
        <button class="btn btn-s" onclick="openDayModal()"><span class="btn-ico" aria-hidden="true"><i data-lucide="ban"></i></span><span class="btn-label">Día libre</span></button>
        <button class="btn btn-s" onclick="openSettings()"><span class="btn-ico" aria-hidden="true"><i data-lucide="settings"></i></span><span class="btn-label">Config</span></button>
        <button class="btn btn-p" onclick="openSubjModal(null)"><span class="btn-ico" aria-hidden="true"><i data-lucide="plus"></i></span><span class="btn-label">Ramo</span></button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="mc"></div>
<div id="tc" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/sync.js"></script>
<script src="js/business.js"></script>
<script src="js/viewstate.js"></script>
<script src="js/render.js"></script>
<script src="js/actions.js"></script>
<script src="js/modals.js"></script>
<script src="js/init.js"></script>
</body>
</html>
